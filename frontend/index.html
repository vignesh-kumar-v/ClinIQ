<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClinIQ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root { --brand: #2563eb; }
    body { font-family: system-ui, sans-serif; background: #f1f5f9; }
    .tab-active { border-bottom: 2px solid var(--brand); color: var(--brand); font-weight: 600; }
    .tab-inactive { border-bottom: 2px solid transparent; color: #64748b; }
    .tab-inactive:hover { color: #1e293b; }
    #chat-messages { scrollbar-width: thin; }
    .bubble-user { background: #2563eb; color: white; border-radius: 1rem 1rem 0.25rem 1rem; }
    .bubble-ai   { background: white; color: #1e293b; border-radius: 1rem 1rem 1rem 0.25rem; border: 1px solid #e2e8f0; }
    .score-badge { font-size: 0.7rem; background: #dbeafe; color: #1d4ed8; padding: 1px 6px; border-radius: 99px; }
    .tag { font-size: 0.7rem; background: #f1f5f9; color: #475569; padding: 2px 8px; border-radius: 99px; border: 1px solid #e2e8f0; }
  </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

<!-- Header -->
<header class="bg-white border-b border-slate-200 px-6 py-3 flex items-center gap-4 shrink-0">
  <div class="flex items-center gap-2">
    <svg class="w-7 h-7 text-blue-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
    </svg>
    <span class="text-xl font-bold text-blue-700 tracking-tight">ClinIQ</span>
  </div>
  <div class="flex-1 max-w-sm">
    <input id="search-input" type="text" placeholder="Search patients…"
      class="w-full text-sm border border-slate-200 rounded-lg px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-blue-400" />
  </div>
  <button onclick="openNewPatientModal()"
    class="ml-auto bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium px-4 py-1.5 rounded-lg transition">
    + New Patient
  </button>
</header>

<!-- Main layout -->
<div class="flex flex-1 overflow-hidden">

  <!-- Patient list sidebar -->
  <aside class="w-72 shrink-0 bg-white border-r border-slate-200 flex flex-col overflow-hidden">
    <div class="px-4 py-2 text-xs font-semibold text-slate-400 uppercase tracking-wide border-b border-slate-100 flex items-center justify-between">
      <span id="patient-count">Loading…</span>
      <label class="flex items-center gap-1 cursor-pointer">
        <input id="semantic-toggle" type="checkbox" class="accent-blue-600" />
        <span>Semantic</span>
      </label>
    </div>
    <ul id="patient-list" class="flex-1 overflow-y-auto divide-y divide-slate-50"></ul>
  </aside>

  <!-- Detail panel -->
  <main class="flex-1 overflow-hidden flex flex-col">
    <div id="empty-state" class="flex-1 flex flex-col items-center justify-center text-slate-400 gap-2">
      <svg class="w-12 h-12 opacity-30" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
      </svg>
      <span class="text-sm">Select a patient</span>
    </div>

    <div id="detail-panel" class="hidden flex-1 flex flex-col overflow-hidden">
      <!-- Patient header -->
      <div class="bg-white border-b border-slate-200 px-6 py-4 shrink-0">
        <div class="flex items-start justify-between">
          <div>
            <h2 id="detail-name" class="text-lg font-bold text-slate-800"></h2>
            <p id="detail-meta" class="text-sm text-slate-500 mt-0.5"></p>
          </div>
          <div class="flex gap-2">
            <button onclick="openAddNoteModal()" class="text-sm border border-slate-200 hover:bg-slate-50 px-3 py-1.5 rounded-lg transition">+ Note</button>
            <button onclick="openUpdateMedModal()" class="text-sm border border-slate-200 hover:bg-slate-50 px-3 py-1.5 rounded-lg transition">Update Med</button>
          </div>
        </div>
        <!-- Tabs -->
        <div class="flex gap-6 mt-4 text-sm">
          <button class="tab pb-2" data-tab="overview" onclick="switchTab('overview')">Overview</button>
          <button class="tab pb-2" data-tab="medications" onclick="switchTab('medications')">Medications</button>
          <button class="tab pb-2" data-tab="conditions" onclick="switchTab('conditions')">Conditions</button>
          <button class="tab pb-2" data-tab="notes" onclick="switchTab('notes')">Notes</button>
          <button class="tab pb-2" data-tab="activity" onclick="switchTab('activity')">Activity</button>
          <button class="tab pb-2" data-tab="chat" onclick="switchTab('chat')">Chat</button>
        </div>
      </div>

      <!-- Tab content -->
      <div class="flex-1 overflow-hidden flex flex-col">

        <!-- Overview -->
        <div id="tab-overview" class="hidden flex-1 overflow-y-auto p-6 space-y-4">
          <div>
            <h3 class="text-xs font-semibold text-slate-400 uppercase mb-2">Demographics</h3>
            <div id="overview-demographics" class="text-sm text-slate-700 space-y-1"></div>
          </div>
          <div>
            <h3 class="text-xs font-semibold text-slate-400 uppercase mb-2">Encounters</h3>
            <div id="overview-encounters" class="text-sm text-slate-700 space-y-1"></div>
          </div>
          <div>
            <h3 class="text-xs font-semibold text-slate-400 uppercase mb-2">Observations (recent)</h3>
            <div id="overview-observations" class="text-sm text-slate-700 space-y-1"></div>
          </div>
        </div>

        <!-- Medications -->
        <div id="tab-medications" class="hidden flex-1 overflow-y-auto p-6">
          <div id="medications-list" class="space-y-2"></div>
        </div>

        <!-- Conditions -->
        <div id="tab-conditions" class="hidden flex-1 overflow-y-auto p-6">
          <div id="conditions-list" class="space-y-2"></div>
        </div>

        <!-- Notes -->
        <div id="tab-notes" class="hidden flex-1 overflow-y-auto p-6">
          <div id="notes-list" class="space-y-3"></div>
        </div>

        <!-- Activity -->
        <div id="tab-activity" class="hidden flex-1 overflow-y-auto p-6">
          <div id="activity-list" class="space-y-2"></div>
        </div>

        <!-- Chat -->
        <div id="tab-chat" class="hidden flex-1 flex flex-col overflow-hidden">
          <div id="chat-messages" class="flex-1 overflow-y-auto p-6 space-y-3"></div>
          <div class="shrink-0 border-t border-slate-200 bg-white p-4 flex gap-3">
            <input id="chat-input" type="text" placeholder="Ask about this patient or say 'Add observation: …'"
              class="flex-1 text-sm border border-slate-200 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400" />
            <button onclick="sendChat()"
              class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition">Send</button>
          </div>
        </div>

      </div>
    </div>
  </main>
</div>

<!-- ── Modals ── -->

<!-- New Patient -->
<div id="modal-new-patient" class="hidden fixed inset-0 bg-black/40 flex items-center justify-center z-50">
  <div class="bg-white rounded-xl shadow-xl w-full max-w-md p-6 space-y-4">
    <h3 class="font-bold text-slate-800 text-lg">New Patient</h3>
    <div class="space-y-3 text-sm">
      <input id="np-name" type="text" placeholder="Full name *" class="w-full border border-slate-200 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400" />
      <div class="flex gap-3">
        <input id="np-age" type="number" placeholder="Age *" class="w-24 border border-slate-200 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400" />
        <select id="np-gender" class="flex-1 border border-slate-200 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400">
          <option value="">Gender *</option>
          <option>Male</option><option>Female</option><option>Other</option>
        </select>
      </div>
      <input id="np-conditions" type="text" placeholder="Conditions (comma-separated)" class="w-full border border-slate-200 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400" />
      <div class="border border-slate-200 rounded-lg p-3 space-y-2">
        <div class="text-xs font-medium text-slate-500">Medication</div>
        <div class="flex gap-2">
          <input id="np-drug" type="text" placeholder="Drug" class="flex-1 border border-slate-200 rounded-lg px-2 py-1.5 focus:outline-none focus:ring-2 focus:ring-blue-400" />
          <input id="np-dose" type="text" placeholder="Dose" class="w-24 border border-slate-200 rounded-lg px-2 py-1.5 focus:outline-none focus:ring-2 focus:ring-blue-400" />
          <input id="np-freq" type="text" placeholder="Frequency" class="w-28 border border-slate-200 rounded-lg px-2 py-1.5 focus:outline-none focus:ring-2 focus:ring-blue-400" />
        </div>
      </div>
      <textarea id="np-notes" placeholder="Initial notes (optional)" rows="2" class="w-full border border-slate-200 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400 resize-none"></textarea>
    </div>
    <div class="flex gap-3 justify-end pt-2">
      <button onclick="closeModal('modal-new-patient')" class="text-sm text-slate-500 hover:text-slate-700 px-4 py-2">Cancel</button>
      <button onclick="createPatient()" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium px-5 py-2 rounded-lg transition">Create</button>
    </div>
  </div>
</div>

<!-- Add Note -->
<div id="modal-add-note" class="hidden fixed inset-0 bg-black/40 flex items-center justify-center z-50">
  <div class="bg-white rounded-xl shadow-xl w-full max-w-md p-6 space-y-4">
    <h3 class="font-bold text-slate-800 text-lg">Add Note</h3>
    <div class="space-y-3 text-sm">
      <select id="note-type" class="w-full border border-slate-200 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400">
        <option value="follow_up">Follow-up</option>
        <option value="initial">Initial</option>
        <option value="discharge">Discharge</option>
        <option value="referral">Referral</option>
      </select>
      <textarea id="note-text" placeholder="Note text *" rows="4" class="w-full border border-slate-200 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400 resize-none"></textarea>
    </div>
    <div class="flex gap-3 justify-end pt-2">
      <button onclick="closeModal('modal-add-note')" class="text-sm text-slate-500 hover:text-slate-700 px-4 py-2">Cancel</button>
      <button onclick="saveNote()" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium px-5 py-2 rounded-lg transition">Save Note</button>
    </div>
  </div>
</div>

<!-- Update Medication -->
<div id="modal-update-med" class="hidden fixed inset-0 bg-black/40 flex items-center justify-center z-50">
  <div class="bg-white rounded-xl shadow-xl w-full max-w-sm p-6 space-y-4">
    <h3 class="font-bold text-slate-800 text-lg">Update Medication</h3>
    <div class="space-y-3 text-sm">
      <input id="med-drug" type="text" placeholder="Drug name *" class="w-full border border-slate-200 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400" />
      <select id="med-field" class="w-full border border-slate-200 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400">
        <option value="dose">Dose</option>
        <option value="frequency">Frequency</option>
      </select>
      <input id="med-value" type="text" placeholder="New value *" class="w-full border border-slate-200 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400" />
    </div>
    <div class="flex gap-3 justify-end pt-2">
      <button onclick="closeModal('modal-update-med')" class="text-sm text-slate-500 hover:text-slate-700 px-4 py-2">Cancel</button>
      <button onclick="updateMedication()" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium px-5 py-2 rounded-lg transition">Update</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div id="toast" class="hidden fixed bottom-6 right-6 px-4 py-3 rounded-xl text-sm font-medium shadow-lg z-50 transition-all"></div>

<script>
const API = 'http://localhost:8000/api';
let currentPatient = null;
let currentTab = 'overview';
let chatSession = null;
let searchDebounce = null;

// ── Init ──────────────────────────────────────────────────────────────────
document.getElementById('search-input').addEventListener('input', e => {
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(() => loadPatients(e.target.value.trim()), 300);
});
document.getElementById('chat-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') sendChat();
});

loadPatients();

// ── Patient list ──────────────────────────────────────────────────────────
async function loadPatients(q = '') {
  const isSemantic = document.getElementById('semantic-toggle').checked;
  document.getElementById('patient-list').innerHTML = '<li class="px-4 py-3 text-xs text-slate-400">Loading…</li>';
  try {
    let data;
    if (q && isSemantic) {
      const r = await fetch(`${API}/patients/search?q=${encodeURIComponent(q)}&limit=30`);
      const j = await r.json();
      data = { patients: j.results, total: j.results.length };
    } else {
      const params = new URLSearchParams({ limit: 100, sort_by: 'patient_name', order: 'asc' });
      if (q) params.set('q', q);
      const r = await fetch(`${API}/patients?${params}`);
      data = await r.json();
    }
    renderPatientList(data.patients || [], data.total || 0, isSemantic && q);
  } catch(e) {
    document.getElementById('patient-list').innerHTML = '<li class="px-4 py-3 text-xs text-red-400">Failed to load</li>';
  }
}

function renderPatientList(patients, total, showScore) {
  document.getElementById('patient-count').textContent = `${total} patient${total !== 1 ? 's' : ''}`;
  const ul = document.getElementById('patient-list');
  if (!patients.length) {
    ul.innerHTML = '<li class="px-4 py-3 text-xs text-slate-400">No patients found</li>';
    return;
  }
  ul.innerHTML = patients.map(p => `
    <li onclick="selectPatient('${p.patient_id}')"
        class="px-4 py-3 cursor-pointer hover:bg-blue-50 transition ${currentPatient?.patient_id === p.patient_id ? 'bg-blue-50 border-l-2 border-blue-600' : ''}">
      <div class="flex items-center justify-between">
        <span class="text-sm font-medium text-slate-800">${p.patient_name || 'Unknown'}</span>
        ${showScore && p.score != null ? `<span class="score-badge">${(p.score*100).toFixed(0)}%</span>` : ''}
      </div>
      <div class="text-xs text-slate-400 mt-0.5">${p.last_visit_date || '—'} · ${p.chunk_count || 0} records</div>
      ${p.conditions_summary ? `<div class="text-xs text-slate-500 mt-0.5 truncate">${p.conditions_summary}</div>` : ''}
    </li>
  `).join('');
}

document.getElementById('semantic-toggle').addEventListener('change', () => {
  loadPatients(document.getElementById('search-input').value.trim());
});

// ── Select patient ────────────────────────────────────────────────────────
async function selectPatient(id) {
  try {
    const r = await fetch(`${API}/patients/${id}`);
    const data = await r.json();
    currentPatient = data;
    chatSession = 'session-' + Date.now();
    document.getElementById('empty-state').classList.add('hidden');
    document.getElementById('detail-panel').classList.remove('hidden');

    document.getElementById('detail-name').textContent =
      data.demographics?.[0]?.text?.split(',')[0]?.replace('Patient: ', '') || id;
    document.getElementById('detail-meta').textContent =
      `${data.total} records · ID: ${id.slice(0,8)}…`;

    document.getElementById('chat-messages').innerHTML = '';
    renderAllTabs(data);
    switchTab('overview');
    loadChatHistory(id);
    // refresh sidebar highlight
    loadPatients(document.getElementById('search-input').value.trim());
  } catch(e) {
    showToast('Failed to load patient', 'error');
  }
}

// ── Render tabs ───────────────────────────────────────────────────────────
function renderAllTabs(data) {
  // Overview
  document.getElementById('overview-demographics').innerHTML =
    (data.demographics || []).map(c => `<p class="py-0.5">${c.text}</p>`).join('') || '<p class="text-slate-400">—</p>';
  document.getElementById('overview-encounters').innerHTML =
    (data.encounters || []).slice(0,5).map(c => `<p class="py-0.5 text-slate-600">${c.text}</p>`).join('') || '<p class="text-slate-400">—</p>';
  document.getElementById('overview-observations').innerHTML =
    (data.observations || []).slice(0,5).map(c => `<p class="py-0.5 text-slate-600">${c.text}</p>`).join('') || '<p class="text-slate-400">—</p>';

  // Medications
  document.getElementById('medications-list').innerHTML =
    (data.medications || []).map(c => `
      <div class="bg-white rounded-lg border border-slate-200 px-4 py-3 text-sm">
        <p class="text-slate-700">${c.text}</p>
        ${c.metadata?.updated_at ? `<p class="text-xs text-blue-500 mt-1">Updated ${c.metadata.updated_at.slice(0,10)}</p>` : ''}
        ${c.metadata?.versioned === 'true' ? '<span class="tag mt-1">versioned</span>' : ''}
      </div>`).join('') || '<p class="text-slate-400 text-sm">No medications</p>';

  // Conditions
  document.getElementById('conditions-list').innerHTML =
    (data.conditions || []).map(c => `
      <div class="bg-white rounded-lg border border-slate-200 px-4 py-3 text-sm text-slate-700">
        ${c.text}
      </div>`).join('') || '<p class="text-slate-400 text-sm">No conditions</p>';

  // Notes
  document.getElementById('notes-list').innerHTML =
    (data.notes || []).map(c => `
      <div class="bg-white rounded-lg border border-slate-200 px-4 py-3 text-sm">
        <p class="text-slate-700">${c.text}</p>
        <div class="flex gap-2 mt-2">
          ${c.metadata?.note_type ? `<span class="tag">${c.metadata.note_type}</span>` : ''}
          ${c.metadata?.timestamp ? `<span class="text-xs text-slate-400">${c.metadata.timestamp.slice(0,10)}</span>` : ''}
        </div>
      </div>`).join('') || '<p class="text-slate-400 text-sm">No notes</p>';
}

// ── Activity tab ──────────────────────────────────────────────────────────
async function loadActivity() {
  if (!currentPatient) return;
  try {
    const r = await fetch(`${API}/patients/${currentPatient.patient_id}/activity?limit=50`);
    const data = await r.json();
    document.getElementById('activity-list').innerHTML =
      (data.entries || []).map(e => `
        <div class="bg-white rounded-lg border border-slate-200 px-4 py-3 text-sm flex items-start gap-3">
          <span class="tag mt-0.5 shrink-0">${e.action}</span>
          <div>
            <p class="text-slate-700">${e.detail || ''}</p>
            <p class="text-xs text-slate-400 mt-1">${e.timestamp?.slice(0,19).replace('T',' ') || ''}</p>
          </div>
        </div>`).join('') || '<p class="text-slate-400 text-sm">No activity</p>';
  } catch {}
}

// ── Tabs ──────────────────────────────────────────────────────────────────
function switchTab(name) {
  currentTab = name;
  document.querySelectorAll('.tab').forEach(el => {
    el.className = `tab pb-2 ${el.dataset.tab === name ? 'tab-active' : 'tab-inactive'}`;
  });
  ['overview','medications','conditions','notes','activity','chat'].forEach(t => {
    document.getElementById(`tab-${t}`).classList.toggle('hidden', t !== name);
    document.getElementById(`tab-${t}`).classList.toggle('flex', t === name && t === 'chat');
  });
  if (name === 'activity') loadActivity();
}

// ── Chat history ──────────────────────────────────────────────────────────
async function loadChatHistory(patientId) {
  try {
    const r = await fetch(`${API}/patients/${patientId}/chat-history`);
    const data = await r.json();
    const history = data.history || [];
    if (!history.length) return;
    const container = document.getElementById('chat-messages');
    const divider = document.createElement('div');
    divider.className = 'flex items-center gap-2 text-xs text-slate-400 my-2';
    divider.innerHTML = '<div class="flex-1 h-px bg-slate-200"></div><span>Previous conversation</span><div class="flex-1 h-px bg-slate-200"></div>';
    container.appendChild(divider);
    history.forEach(turn => appendBubble(turn.content, turn.role === 'assistant' ? 'ai' : 'user'));
    const end = document.createElement('div');
    end.className = 'flex items-center gap-2 text-xs text-slate-400 my-2';
    end.innerHTML = '<div class="flex-1 h-px bg-slate-200"></div><span>New session</span><div class="flex-1 h-px bg-slate-200"></div>';
    container.appendChild(end);
  } catch {}
}

// ── Chat ──────────────────────────────────────────────────────────────────
async function sendChat() {
  if (!currentPatient) return;
  const input = document.getElementById('chat-input');
  const msg = input.value.trim();
  if (!msg) return;
  input.value = '';

  appendBubble(msg, 'user');
  const thinking = appendBubble('…', 'ai');
  try {
    const r = await fetch(`${API}/patients/${currentPatient.patient_id}/query`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: msg, session_id: chatSession }),
    });
    const data = await r.json();
    thinking.textContent = data.answer || '(no response)';
    if (data.intent === 'write' || data.intent === 'mixed') {
      showToast('Record updated', 'success');
      // Refresh patient data
      const pr = await fetch(`${API}/patients/${currentPatient.patient_id}`);
      const pd = await pr.json();
      currentPatient = pd;
      renderAllTabs(pd);
    }
  } catch(e) {
    thinking.textContent = 'Error: ' + e.message;
  }
}

function appendBubble(text, role) {
  const wrap = document.createElement('div');
  wrap.className = `flex ${role === 'user' ? 'justify-end' : 'justify-start'}`;
  const bubble = document.createElement('div');
  bubble.className = `max-w-xs md:max-w-md lg:max-w-lg px-4 py-2.5 text-sm ${role === 'user' ? 'bubble-user' : 'bubble-ai'}`;
  bubble.textContent = text;
  wrap.appendChild(bubble);
  const container = document.getElementById('chat-messages');
  container.appendChild(wrap);
  container.scrollTop = container.scrollHeight;
  return bubble;
}

// ── Create patient ────────────────────────────────────────────────────────
async function createPatient() {
  const name = document.getElementById('np-name').value.trim();
  const age  = parseInt(document.getElementById('np-age').value);
  const gender = document.getElementById('np-gender').value;
  if (!name || !age || !gender) { showToast('Name, age, and gender required', 'error'); return; }

  const conditions = document.getElementById('np-conditions').value
    .split(',').map(s => s.trim()).filter(Boolean);
  const drug = document.getElementById('np-drug').value.trim();
  const dose = document.getElementById('np-dose').value.trim();
  const freq = document.getElementById('np-freq').value.trim();
  const medications = drug ? [{ drug, dose, frequency: freq }] : [];
  const notes = document.getElementById('np-notes').value.trim();

  try {
    const r = await fetch(`${API}/patients/new`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, age, gender, conditions, medications, notes }),
    });
    const data = await r.json();
    if (data.patient_id) {
      showToast('Patient created', 'success');
      closeModal('modal-new-patient');
      await loadPatients();
      selectPatient(data.patient_id);
    } else {
      showToast('Create failed', 'error');
    }
  } catch(e) { showToast('Error: ' + e.message, 'error'); }
}

// ── Add note ──────────────────────────────────────────────────────────────
async function saveNote() {
  if (!currentPatient) return;
  const text = document.getElementById('note-text').value.trim();
  const note_type = document.getElementById('note-type').value;
  if (!text) { showToast('Note text required', 'error'); return; }
  try {
    const r = await fetch(`${API}/patients/${currentPatient.patient_id}/note`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text, note_type }),
    });
    const data = await r.json();
    if (data.status === 'saved') {
      showToast('Note saved', 'success');
      closeModal('modal-add-note');
      document.getElementById('note-text').value = '';
      const pr = await fetch(`${API}/patients/${currentPatient.patient_id}`);
      const pd = await pr.json();
      currentPatient = pd;
      renderAllTabs(pd);
    }
  } catch(e) { showToast('Error: ' + e.message, 'error'); }
}

// ── Update medication ─────────────────────────────────────────────────────
async function updateMedication() {
  if (!currentPatient) return;
  const drug  = document.getElementById('med-drug').value.trim();
  const field = document.getElementById('med-field').value;
  const value = document.getElementById('med-value').value.trim();
  if (!drug || !value) { showToast('Drug and value required', 'error'); return; }
  try {
    const r = await fetch(`${API}/patients/${currentPatient.patient_id}/medication`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ drug, field, value }),
    });
    const data = await r.json();
    if (data.status === 'updated') {
      showToast('Medication updated', 'success');
      closeModal('modal-update-med');
      document.getElementById('med-drug').value = '';
      document.getElementById('med-value').value = '';
      const pr = await fetch(`${API}/patients/${currentPatient.patient_id}`);
      const pd = await pr.json();
      currentPatient = pd;
      renderAllTabs(pd);
    }
  } catch(e) { showToast('Error: ' + e.message, 'error'); }
}

// ── Modals ────────────────────────────────────────────────────────────────
function openNewPatientModal()  { document.getElementById('modal-new-patient').classList.remove('hidden'); }
function openAddNoteModal()     { if (!currentPatient) return; document.getElementById('modal-add-note').classList.remove('hidden'); }
function openUpdateMedModal()   { if (!currentPatient) return; document.getElementById('modal-update-med').classList.remove('hidden'); }
function closeModal(id)         { document.getElementById(id).classList.add('hidden'); }

// Close modal on backdrop click
document.querySelectorAll('[id^="modal-"]').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) closeModal(m.id); });
});

// ── Toast ─────────────────────────────────────────────────────────────────
function showToast(msg, type = 'success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `fixed bottom-6 right-6 px-4 py-3 rounded-xl text-sm font-medium shadow-lg z-50 transition-all ${
    type === 'error' ? 'bg-red-500 text-white' : 'bg-emerald-500 text-white'
  }`;
  t.classList.remove('hidden');
  setTimeout(() => t.classList.add('hidden'), 3000);
}
</script>
